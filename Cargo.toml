[workspace]
resolver = "2"
members = ["crates/daw-model", "crates/daw-als", "crates/daw-engine"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
daw-model = { path = "crates/daw-model" }

# The C++ time-stretcher is far too slow unoptimised; keep it fast in debug builds too.
[profile.dev.package.ssstretch]
opt-level = 3
